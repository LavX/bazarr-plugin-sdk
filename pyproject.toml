[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bazarr-plugin-sdk"
dynamic = ["version"]
description = "Plugin SDK for Bazarr plugin workers: plugin context, error vocabulary, worker runtime and conformance tests."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laszlo Toth", email = "lavx@lavx.hu" }]
keywords = ["bazarr", "plugin", "sdk", "subtitles"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.version]
path = "src/bazarr_plugin_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bazarr_plugin_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
