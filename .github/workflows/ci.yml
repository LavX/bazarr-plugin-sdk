name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and test tools
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Run the tests
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .

  wire-stdlib-only:
    name: wire package imports only the standard library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check imports
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          allowed = set(sys.stdlib_module_names)
          problems = []
          for path in sorted(pathlib.Path("src/bazarr_plugin_sdk/wire").glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module]
                  else:
                      continue
                  for name in names:
                      if name.split(".")[0] not in allowed:
                          problems.append(f"{path}:{node.lineno} imports {name}")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("wire imports are standard library only")
          PY

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import bazarr_plugin_sdk as sdk; print(sdk.__version__)"
